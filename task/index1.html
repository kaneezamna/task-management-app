<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles1.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
      
        <h1 class="app-title">Task Manager</h1>
    
         
          
        </div>
       
        
        <div class="add-task-container">
            <input type="text" id="taskTitle" placeholder="Task Title">
            <textarea id="taskDescription" placeholder="Task Description"></textarea>
            <input type="text" id="taskAssignee" placeholder="Assign To">
            <input type="date" id="taskDueDate">
            <button id="addTaskBtn">Add Task</button>
        </div>
        
        <div class="board-container">
            <div class="column" id="todo-column">
                <h2>To Do</h2>
                <div class="tasks" id="todo-tasks"></div>
            </div>
            
            <div class="column" id="inprogress-column">
                <h2>In Progress</h2>
                <div class="tasks" id="inprogress-tasks"></div>
            </div>
            
            <div class="column" id="done-column">
                <h2>Done</h2>
                <div class="tasks" id="done-tasks"></div>
            </div>
        </div>
    </div>

    <script src="script1.js"></script>
</body>
</html>
